services:
  postgres:
    image: postgres:18-alpine
    container_name: clicksafe-postgres
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clicksafe

  api-tool:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.api
    image: clicksafe-api:latest
    container_name: clicksafe-api-tool
    command: [ "/clicksafe_tool", "migrate" ]
    environment:
      - TOOLING_DB_USER=${POSTGRES_USER}
      - TOOLING_DB_PASSWORD=${POSTGRES_PASSWORD}
      - TOOLING_DB_HOST=postgres:${POSTGRES_PORT}
      - TOOLING_DB_NAME=${POSTGRES_DB}
      - TOOLING_STORAGE_ATTACHMENT_ROOT_DIR=/var/www/my-app/private/attachment
    env_file:
      - ../../.env
    volumes:
      - attachment_content_data:/var/www/my-app/private/attachment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clicksafe

  api:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.api
    image: clicksafe-api:latest
    container_name: clicksafe-api
    environment:
      - API_DB_USER=${POSTGRES_USER}
      - API_DB_PASSWORD=${POSTGRES_PASSWORD}
      - API_DB_HOST=postgres:${POSTGRES_PORT}
      - API_DB_NAME=${POSTGRES_DB}
      - API_SMTP_HOST=${SMTP_HOST}
      - API_SMTP_PORT=${SMTP_PORT}
      - API_SMTP_USERNAME=${SMTP_USERNAME}
      - API_SMTP_PASSWORD=${SMTP_PASSWORD}
      - API_SMTP_TLS=${SMTP_TLS}
      - API_SMTP_SSL=${SMTP_SSL}
      - API_AUTH_TOKEN_HASH_KEY=${AUTH_TOKEN_HASH_KEY}
      - API_AUTH_LOGIN_REQUESTS_PER_MINUTE=${AUTH_LOGIN_REQUESTS_PER_MINUTE}
      - API_AUTH_LOGIN_BURST=${AUTH_LOGIN_BURST}
      - API_AUTH_LOGIN_EXPIRES_IN=${AUTH_LOGIN_EXPIRES_IN}
      - API_WEB_READ_TIMEOUT=${API_WEB_READ_TIMEOUT:-60s}
      - API_WEB_WRITE_TIMEOUT=${API_WEB_WRITE_TIMEOUT:-12m}
      - API_WEB_IDLE_TIMEOUT=${API_WEB_IDLE_TIMEOUT:-120s}
      - API_MAX_ADAPTER_ADDR=max-adapter:9090
      - API_MAX_ADAPTER_TOKEN=${MAX_ADAPTER_GRPC_TOKEN}
      - API_VOICE_ADAPTER_ADDR=${API_VOICE_ADAPTER_ADDR:-voice-adapter:9091}
      - API_VOICE_ADAPTER_TOKEN=${VOICE_ADAPTER_GRPC_TOKEN:-}
      - API_VOICE_CLONE_TIMEOUT=${API_VOICE_CLONE_TIMEOUT:-10m}
      - API_VOICE_ASR_TIMEOUT=${API_VOICE_ASR_TIMEOUT:-5m}
      - API_VOICE_HEALTH_TTL=${API_VOICE_HEALTH_TTL:-1200ms}
      - API_VOICE_OUTPUT_CHUNK_SIZE=${API_VOICE_OUTPUT_CHUNK_SIZE:-65536}
      - API_STORAGE_ATTACHMENT_ROOT_DIR=/var/www/my-app/private/attachment
      - API_STORAGE_ATTACHMENT_PATH_PREFIX=/attachment
    env_file:
      - ../../.env
    volumes:
      - attachment_content_data:/var/www/my-app/private/attachment
    depends_on:
      postgres:
        condition: service_healthy
      api-tool:
        condition: service_completed_successfully
      max-adapter:
        condition: service_healthy
    networks:
      - clicksafe

  max-adapter:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.max-adapter
    image: clicksafe-max-adapter:latest
    container_name: clicksafe-max-adapter
    restart: always
    environment:
      - MAX_ADAPTER_GRPC_BIND=0.0.0.0:9090
      - MAX_ADAPTER_GRPC_TOKEN=${MAX_ADAPTER_GRPC_TOKEN}
      - MAX_ADAPTER_SECRET_KEY=${MAX_ADAPTER_SECRET_KEY}
      - MAX_ADAPTER_DB_USER=${POSTGRES_USER}
      - MAX_ADAPTER_DB_PASSWORD=${POSTGRES_PASSWORD}
      - MAX_ADAPTER_DB_HOST=postgres:${POSTGRES_PORT}
      - MAX_ADAPTER_DB_NAME=clicksafe_max_adapter
      - MAX_ADAPTER_TEMP_DIR=/var/lib/clicksafe-max-adapter/tmp
    env_file:
      - ../../.env
    volumes:
      - max_adapter_data:/var/lib/clicksafe-max-adapter
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os,socket; port=int(os.environ.get('MAX_ADAPTER_GRPC_BIND','0.0.0.0:9090').rsplit(':',1)[1]); socket.create_connection(('127.0.0.1', port), 1).close()" ]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    networks:
      - clicksafe

  voice-adapter:
    profiles: [ "voice" ]
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.voice-adapter
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
        TORCH_PACKAGES: torch==2.8.0 torchaudio==2.8.0
    image: clicksafe-voice-adapter:latest
    container_name: clicksafe-voice-adapter
    restart: always
    environment:
      - VOICE_ADAPTER_GRPC_BIND=0.0.0.0:9091
      - VOICE_ADAPTER_GRPC_TOKEN=${VOICE_ADAPTER_GRPC_TOKEN:-}
      - VOICE_ADAPTER_TEMP_DIR=/var/lib/clicksafe-voice-adapter/tmp
      - VOICE_ADAPTER_MODEL_PROVIDER=${VOICE_ADAPTER_MODEL_PROVIDER:-omnivoice}
      - VOICE_ADAPTER_MODEL_ID=${VOICE_ADAPTER_MODEL_ID:-k2-fsa/OmniVoice}
      - VOICE_ADAPTER_DEVICE=${VOICE_ADAPTER_DEVICE:-auto}
      - VOICE_ADAPTER_DTYPE=${VOICE_ADAPTER_DTYPE:-auto}
      - VOICE_ADAPTER_LOAD_ASR=${VOICE_ADAPTER_LOAD_ASR:-true}
      - VOICE_ADAPTER_ASR_PROVIDER=${VOICE_ADAPTER_ASR_PROVIDER:-gigaam_onnx}
      - VOICE_ADAPTER_ASR_MODEL_ID=${VOICE_ADAPTER_ASR_MODEL_ID:-gigaam-v3-e2e-rnnt}
      - VOICE_ADAPTER_ASR_REVISION=${VOICE_ADAPTER_ASR_REVISION:-}
      - VOICE_ADAPTER_ASR_TRUST_REMOTE_CODE=${VOICE_ADAPTER_ASR_TRUST_REMOTE_CODE:-false}
      - VOICE_ADAPTER_CONCURRENCY=${VOICE_ADAPTER_CONCURRENCY:-1}
      - HF_HOME=/var/lib/clicksafe-voice-adapter/huggingface
      - TORCH_HOME=/var/lib/clicksafe-voice-adapter/torch
      - HF_TOKEN=${HF_TOKEN:-}
    env_file:
      - ../../.env
    volumes:
      - voice_adapter_data:/var/lib/clicksafe-voice-adapter
    healthcheck:
      test: [ "CMD", "python", "-c", "import os,socket; port=int(os.environ.get('VOICE_ADAPTER_GRPC_BIND','0.0.0.0:9091').rsplit(':',1)[1]); socket.create_connection(('127.0.0.1', port), 1).close()" ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - clicksafe

  caddy:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    image: clicksafe-caddy:latest
    container_name: clicksafe-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - clicksafe
    depends_on:
      - api

networks:
  clicksafe:
    driver: bridge

volumes:
  postgres_data:
  attachment_content_data:
  max_adapter_data:
  voice_adapter_data:
  caddy_data:
  caddy_config:
