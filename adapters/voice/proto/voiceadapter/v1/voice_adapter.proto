syntax = "proto3";

package voiceadapter.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/zabolotny-dev/clicksafe/adapters/voice/gen/go/voiceadapter/v1;voiceadapterv1";

service VoiceAdapterService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc Synthesize(stream SynthesizeRequest) returns (stream SynthesizeEvent);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string model_provider = 2;
  string model_id = 3;
  string device = 4;
}

enum SynthesisMode {
  SYNTHESIS_MODE_UNSPECIFIED = 0;
  SYNTHESIS_MODE_VOICE_CLONE = 1;
  SYNTHESIS_MODE_VOICE_DESIGN = 2;
  SYNTHESIS_MODE_AUTO_VOICE = 3;
}

enum AudioOutputFormat {
  AUDIO_OUTPUT_FORMAT_UNSPECIFIED = 0;
  AUDIO_OUTPUT_FORMAT_WAV_PCM16 = 1;
  AUDIO_OUTPUT_FORMAT_OGG_OPUS = 2;
}

message AudioDescriptor {
  string filename = 1;
  string mime_type = 2;
  string extension = 3;
  int64 size = 4;
}

message TranscribeRequest {
  AudioDescriptor audio = 1;
  bytes audio_data = 2;
  string language = 3;
}

message TranscribeResponse {
  string text = 1;
}

message GenerationConfig {
  optional double speed = 1;
  optional double duration_seconds = 2;
  optional int32 inference_steps = 3;
  optional double guidance_scale = 4;
  optional bool denoise = 5;
  optional bool preprocess_prompt = 6;
  optional bool postprocess_output = 7;
  optional double audio_chunk_duration = 8;
  optional double audio_chunk_threshold = 9;
}

message OutputConfig {
  AudioOutputFormat format = 1;
  int32 sample_rate_hz = 2;
  int32 chunk_size = 3;
}

message SynthesisMetadata {
  string request_id = 1;
  string text = 2;
  SynthesisMode mode = 3;
  string language = 4;
  string reference_text = 5;
  string instruct = 6;
  AudioDescriptor reference_audio = 7;
  GenerationConfig generation_config = 8;
  OutputConfig output_config = 9;
  google.protobuf.Struct model_options = 10;
}

message ReferenceAudioChunk {
  bytes data = 1;
  int64 offset = 2;
}

message SynthesizeRequest {
  oneof payload {
    SynthesisMetadata metadata = 1;
    ReferenceAudioChunk reference_audio_chunk = 2;
  }
}

message SynthesisProgress {
  string stage = 1;
  string message = 2;
  int32 percent = 3;
}

message AudioChunk {
  bytes data = 1;
  int64 offset = 2;
}

message SynthesisCompleted {
  string request_id = 1;
  AudioOutputFormat format = 2;
  string mime_type = 3;
  string extension = 4;
  int32 sample_rate_hz = 5;
  int64 duration_ms = 6;
  int64 total_bytes = 7;
  bytes waveform_peaks = 8;
}

message SynthesizeEvent {
  oneof event {
    SynthesisProgress progress = 1;
    AudioChunk audio_chunk = 2;
    SynthesisCompleted completed = 3;
  }
}
