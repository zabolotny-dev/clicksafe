<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портал самообслуживания — Смена пароля</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        .logo { text-align: center; margin-bottom: 8px; }
        .logo-title { font-size: 20px; font-weight: bold; color: #1a3a6b; }
        .logo-sub { font-size: 12px; color: #888; margin-bottom: 28px; text-align: center; }
        h2 { font-size: 16px; color: #333; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid #e8e8e8; padding-bottom: 12px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 13px; font-weight: 500; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 4px; box-sizing: border-box; font-size: 14px; color: #333; }
        .form-group input:focus { outline: none; border-color: #1a3a6b; }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
        .submit-btn { width: 100%; padding: 11px; background-color: #1a3a6b; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; font-weight: 600; margin-top: 8px; }
        .submit-btn:hover { background-color: #142d57; }
        .footer { text-align: center; margin-top: 24px; font-size: 11px; color: #aaa; }
        .support { text-align: center; margin-top: 12px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="{{.Organization.Logo}}" alt="Логотип" style="height: 88px; width: auto; display: block; margin: 0 auto 12px;">
            <div class="logo-title">Корпоративный портал</div>
        </div>
        <div class="logo-sub">Служба каталогов — Самообслуживание</div>
        <h2>Смена доменного пароля</h2>
        <form method="POST" action="{{.Target.Link}}">
            <div class="form-group">
                <label for="username">Доменное имя пользователя (логин)</label>
                <input type="text" id="username" name="username" placeholder="Например: i.ivanov" required>
            </div>
            <div class="form-group">
                <label for="current_password">Текущий пароль</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">Новый пароль</label>
                <input type="password" id="new_password" name="new_password" required>
                <div class="hint">Не менее 12 символов, включая заглавные буквы, цифры и спецсимволы.</div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите новый пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="submit-btn">Сменить пароль</button>
        </form>
        <div class="support">Техническая поддержка: 8-499-321-73-77</div>
        <div class="footer">&copy; 2026 Служба информационных технологий</div>
    </div>
</body>
</html>
